services:
  app:
    build: .
    ports:
      - "${FREEAGENT_HTTP_PORT:-8000}:8000"   # FastAPI / Web UI / Producer API
      - "${FREEAGENT_VNC_PORT:-6080}:6080"   # noVNC (headed 浏览器预览)
      - "${FREEAGENT_SOLVER_PORT:-8889}:8889"   # Turnstile Solver
    environment:
      DISPLAY: ":99"
      ACCOUNT_MANAGER_DATABASE_URL: sqlite:////app/data/account_manager.db
      APP_PASSWORD: ${FREEAGENT_APP_PASSWORD:?请配置 FREEAGENT_APP_PASSWORD}
      PRODUCER_API_KEY: ${FREEAGENT_PRODUCER_API_KEY:?请配置 FREEAGENT_PRODUCER_API_KEY}
      # 可选：设置 VNC 密码
      # - VNC_PASSWORD=changeme
    volumes:
      - ./data:/app/data   # 持久化 SQLite 数据库
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
